name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The ledger is Postgres, so CI needs one. A service container rather than the
    # hosted Supabase instance on purpose: CI must not be able to touch the database
    # the demo runs on, and it must still pass when that project is paused or its
    # password is rotated. Each suite isolates itself in a throwaway DB_SCHEMA on top
    # of this, exactly as it does locally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Proxy checks
        run: python tests/test_proxy.py
      - name: Predictor checks
        run: python tests/test_predictor.py
      - name: Alerts checks
        run: python tests/test_alerts.py
      - name: Treasury checks
        run: python tests/test_treasury.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
