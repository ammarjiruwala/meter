name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The ledger is Postgres, so CI needs one. A service container rather than the
    # hosted Supabase instance on purpose: CI must not be able to touch the database
    # the demo runs on, and it must still pass when that project is paused or its
    # password is rotated. Each suite isolates itself in a throwaway DB_SCHEMA on top
    # of this, exactly as it does locally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Blocking, because the backend set is currently clean (verified 2026-08-03), so a
      # finding here is genuinely new rather than pre-existing noise. Audits
      # requirements.txt only — the shipped set. A CVE in pip-audit's own dev-only
      # dependencies is not a CVE in the deployed image.
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Proxy checks
        run: python tests/test_proxy.py
      - name: Predictor checks
        run: python tests/test_predictor.py
      - name: Alerts checks
        run: python tests/test_alerts.py
      - name: Treasury checks
        run: python tests/test_treasury.py
      # Was missing entirely until 2026-08-03. `judge/` is 206 checks covering the
      # session-scoped tenant, the per-project breaker floor and the call cap — the
      # surface a stranger's card touches — and none of it was gated on a PR.
      - name: Judge checks
        run: python tests/test_judge.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      # `critical`, not `high`, and that is a deliberate threshold rather than a dodge.
      # As of 2026-08-03 the tree carries 3 high advisories (sharp/libvips
      # CVE-2026-33327/33328/35590/35591 and postcss), all transitive through `next`, and
      # `npm audit fix --force` "resolves" them by installing next@9.3.3 — a six-major
      # downgrade that would delete this app. Gating on high would mean a permanently red
      # build, and a permanently red build is one nobody reads. This still fails on
      # anything critical. Revisit when Next ships a patched sharp.
      - name: Dependency audit
        run: npm audit --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
