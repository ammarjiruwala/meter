# Meter pricing table — version 2026-08-01
#
# ARCHITECTURE.md §3: rates live here, not in code, and every ledger row stores the
# `pricing_version` it was priced with. That is what keeps historical rows reproducible
# after a provider changes its rate card — repricing history in place would silently
# rewrite the only priced record of a company's spend.
#
# ─────────────────────────────────────────────────────────────────────────────
# ✅ VERIFIED 2026-08-01 against the providers' own published rate cards
# ─────────────────────────────────────────────────────────────────────────────
#   Anthropic — platform.claude.com/docs/en/about-claude/pricing
#   OpenAI    — developers.openai.com/api/docs/pricing
#
# ⚠️  ONE DATED ITEM — SEE `claude-sonnet-5` BELOW. Its introductory rate expires
#     2026-08-31. On 2026-09-01 someone must copy this file to `2026-09-01.yaml`, apply
#     the standard Sonnet 5 rates, and bump PRICING_VERSION. Historical rows keep
#     pointing at this file and stay correct. See PROPOSALS.md C1.
#
# ─────────────────────────────────────────────────────────────────────────────
# Units and semantics
# ─────────────────────────────────────────────────────────────────────────────
# All rates are USD per 1,000,000 tokens.
#
#   input        standard uncached input tokens
#   output       generated tokens
#   cache_write  tokens written into the provider's prompt cache
#   cache_read   tokens served from the provider's prompt cache
#
# The two providers model caching differently, and the difference is real money:
#
#   Anthropic bills a cache WRITE at a premium and a read at a discount —
#     5-minute TTL write = 1.25x input, 1-hour TTL write = 2x input, read = 0.1x input.
#   OpenAI bills no separate write at all; its "cached input" rate is a read discount
#     only, so `cache_write` is omitted below and falls back to the plain input rate.
#
# ponytail: `cache_write` carries the 5-minute rate, which is the default TTL and what
# the overwhelming majority of traffic uses. Anthropic's 1-hour writes cost 2x input,
# not 1.25x, and are recorded here as `cache_write_1h` but NOT yet read by the pricer —
# the proxy only sees Anthropic's aggregate `cache_creation_input_tokens` and does not
# split the two TTLs. Upgrade path when it matters: parse
# `usage.cache_creation.ephemeral_1h_input_tokens`, add a `cache_write_1h_tokens`
# ledger column, and price it off the field below. Until then, a 1-hour-TTL workload is
# under-billed by 0.75x input on its cache writes only.
#
# Pricing on total tokens rather than on these buckets would make Meter visibly wrong on
# heavy-cache and batch workloads — exactly the workloads a cost tool exists to explain.

version: "2026-08-01"
currency: USD

# Both providers discount asynchronous batch endpoints by 50% on input and output.
# Not yet wired into the proxy (batch endpoints are not proxied); here so the schema
# does not change when they are.
batch_discount: 0.5

# Matched longest-prefix-first against the model string the caller sent, so a dated
# snapshot like `claude-haiku-4-5-20251001` resolves to the `claude-haiku-4-5` entry
# without needing a row per snapshot. Longest wins, so `gpt-5-mini` is never swallowed
# by the shorter `gpt-5`.
models:
  # ── Anthropic ─────────────────────────────────────────────────────────────
  # Cache writes are 1.25x input (5m) / 2x input (1h); reads are 0.1x input.

  # ⚠️ INTRODUCTORY PRICING, EXPIRES 2026-08-31.
  # Standard rates from 2026-09-01: input 3.00, output 15.00, cache_write 3.75,
  # cache_write_1h 6.00, cache_read 0.30. Do not edit this file to apply them —
  # create `2026-09-01.yaml`, or every historical row silently reprices.
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_write_1h: 4.00
    cache_read: 0.20

