  /v3/available_number:
    get:
      operationId: getAvailableNumber
      summary: Get an available sending number
      description: |
        Returns the best available line (E.164) to send from, applying smart
        number assignment. Optionally pass `to` recipients to make the choice
        "sticky" — reusing the line an existing chat with those recipients is
        already on. Without `to`, the best available line is chosen, always
        preferring lines with a healthier reputation.

        This does not reserve the line. Without `to`, the least-recently-used
        available line is returned — suggestions and your own sends (including
        an explicit `from` on chat creation) both count as use, so successive
        calls cycle through your available lines and traffic spreads evenly.
        Pass the returned `phone_number` as `from` when you create the chat to
        guarantee the same line.

        Also returns `vcf_url`: a time-limited link to a vCard (`.vcf`) for the
        chosen line, carrying its contact card (name/photo) with the chosen
        number as the primary `TEL` and the partner's other available lines as
        backups. Share it with recipients so they can save the line as a contact.
        Lines you pass in `exclude_from` are left out of the vCard too.
      tags:
        - Phone Numbers
      security:
        - BearerAuth: []
      parameters:
        - name: to
          in: query
          required: false
          description: |
            Recipient handles (E.164 or email) the message is destined for. When
            provided, an existing chat with these recipients makes the choice
            sticky. Repeat the parameter for multiple recipients.
          schema:
            type: array
            items:
              type: string
          example:
            - '+14155559876'
        - name: exclude_from
          in: query
          required: false
          description: |
            Lines (E.164) to leave out of this selection. Applies to the returned
            `phone_number`, to the sticky choice when `to` is given, and to the
            vCard's backup numbers. Repeat the parameter for multiple lines; use
            `%2B` for the leading `+`.

            Numbers that are not your lines are ignored. Every entry must be
            E.164 — a value like `4155551234` is rejected rather than silently
            skipped. Excluding every one of your available lines returns 400.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          example:
            - '+12052535597'
      responses:
        '200':
          description: Available number resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableNumberResult'
              example:
                phone_number: '+12025551234'
                vcf_url: https://s3.us-east-1.amazonaws.com/linq-attachments/vcf/9716d5c5/12025551234.vcf?X-Amz-Signature=...
        '400':
          description: Invalid `exclude_from` entry, or every available line was excluded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: No available (non-flagged) line to send from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
