  /v3/contact_card:
    get:
      operationId: getContactCard
      summary: Get contact cards
      description: |
        Returns the contact card for a specific phone number, or all contact cards for the
        authenticated partner if no `phone_number` is provided.
      tags:
        - Contact Card
      security:
        - BearerAuth: []
      parameters:
        - name: phone_number
          in: query
          required: false
          description: E.164 phone number to filter by. If omitted, all my cards for the partner are returned.
          schema:
            type: string
            example: '+15551234567'
      responses:
        '200':
          description: Contact card(s) returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactCardResponse'
              example:
                contact_cards:
                  - phone_number: '+15551234567'
                    first_name: John
                    last_name: Doe
                    image_url: https://cdn.linqapp.com/contact-card/example.jpg
                    is_active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: setupContactCard
      summary: Setup contact card
      description: |
        Creates a contact card for a phone number. This endpoint is intended for initial, one-time setup only.

        If setup does not complete, the response is `500` (`2022`) — call this endpoint again.

        **Note:** once a card is active, this endpoint returns `409` (`2014`) so an existing
        card is never overwritten by accident. Use `PATCH /v3/contact_card` to change it.
      tags:
        - Contact Card
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetContactCardRequest'
            examples:
              default:
                summary: Set up a contact card for a business line
                value:
                  phone_number: '+15551234567'
                  first_name: Acme
                  last_name: Support
                  image_url: https://cdn.linqapp.com/contact-card/example.jpg
      responses:
        '200':
          description: Contact card created/updated and sync attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetContactCardResponse'
              example:
                phone_number: '+15551234567'
                first_name: John
                last_name: Doe
                image_url: https://cdn.linqapp.com/contact-card/example.jpg
                is_active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateContactCard
      summary: Update contact card
      description: |
        Partially updates the contact card for a phone number.

        Fetches the current contact card and merges the provided fields.
        Only fields present in the request body are updated; omitted fields retain their existing values.

        If the update does not complete, the response is `500` (`2022`) — call this endpoint again.
      tags:
        - Contact Card
      security:
        - BearerAuth: []
      parameters:
        - name: phone_number
          in: query
          required: true
          description: E.164 phone number of the contact card to update
          schema:
            type: string
            example: '+15551234567'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactCardRequest'
            example:
              first_name: John
              last_name: Doe
              image_url: https://cdn.linqapp.com/contact-card/example.jpg
      responses:
        '200':
          description: Contact card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetContactCardResponse'
              example:
                phone_number: '+15551234567'
                first_name: John
                last_name: Doe
                image_url: https://cdn.linqapp.com/contact-card/example.jpg
                is_active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/chats/{chatId}/location/request:
    post:
      operationId: requestChatLocation
      summary: Request location sharing
      description: |
        Request a contact in a chat to share their location. They receive an iMessage
        prompt and must accept before any location is available; once they do, read their
        location coordinates with `GET /v3/chats/{chatId}/location`.

        The request is delivered asynchronously. The endpoint returns immediately with
        `{ "success": true, "message": "Location request sent" }` and does not return
        coordinates.

        Location requests only work in **1:1 iMessage chats** (Apple limitation):

        - Group chats (any service) return `409` with code `2016`
          (`GroupChatNotSupported`).
        - 1:1 SMS and RCS chats return `409` with code `2017`
          (`ChatServiceNotSupported`).
      tags:
        - Location Sharing
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The chat ID to request location from
          example: 975d0776-bd17-4273-8337-f346b4c661b0
      responses:
        '200':
          description: Location request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationRequestResponse'
              example:
                success: true
                message: Location request sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chat does not support location requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                groupChatNotSupported:
                  summary: Group chat (any service)
                  value:
                    error:
                      status: 409
                      code: 2016
                      message: Location requests are not supported in group chats
                      doc_url: https://docs.linqapp.com/error/codes/2xxx/2016/
                    success: false
                chatServiceNotSupported:
                  summary: 1:1 SMS or RCS chat (not iMessage)
                  value:
                    error:
                      status: 409
                      code: 2017
                      message: Location requests are only supported in iMessage chats
                      doc_url: https://docs.linqapp.com/error/codes/2xxx/2017/
                    success: false
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/chats/{chatId}/location:
    get:
      operationId: getChatLocation
      summary: Get location data
      description: |
        Retrieve the current location for contacts sharing with you in a chat.

        The response is wrapped in the standard `{ "success": true, "data": ... }` envelope —
        the body is **not** a bare GeoJSON document. `data` is a
        [GeoJSON](https://datatracker.ietf.org/doc/html/rfc7946) `FeatureCollection` with a
        `Feature` for each participant actively sharing their location.

        Works for both 1:1 and group chats. In group chats, `data.features` contains a separate
        feature for each participant who is sharing. Each feature's `properties.handle` identifies the user.

        Returns an empty `data.features` array if no one is sharing or no location data is
        available yet. If sharing started but this stays empty, see the **Location Sharing**
        overview.

        Poll this endpoint to track a moving contact. `properties.updated_at`
        reflects when each participant's location was last updated. There is no
        coordinate-update webhook. See the **Location Sharing** overview for polling
        guidance.
      tags:
        - Location Sharing
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The chat ID to get location data for
          example: 975d0776-bd17-4273-8337-f346b4c661b0
      responses:
        '200':
          description: Location data retrieved
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GetChatLocationResponse'
              example:
                success: true
                data:
                  type: FeatureCollection
                  features:
                    - type: Feature
                      geometry:
                        type: Point
                        coordinates:
                          - -122.4194
                          - 37.7749
                      properties:
                        handle: '+15551234567'
                        address: 123 Main St, San Francisco, CA 94102
                        locality: San Francisco
                        updated_at: '2026-02-04T12:00:00Z'
                    - type: Feature
                      geometry:
                        type: Point
                        coordinates:
                          - -122.408
                          - 37.784
                          - 15.2
                      properties:
                        handle: '+15559876543'
                        address: 456 Market St, San Francisco, CA 94105
                        locality: San Francisco
                        updated_at: '2026-02-04T12:01:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
