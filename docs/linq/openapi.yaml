        chat:
          type: object
          description: Chat context
          required:
            - id
            - is_group
            - owner_handle
            - health_status
          properties:
            id:
              type: string
              format: uuid
              description: Chat identifier
            is_group:
              type: boolean
              description: Whether this is a group chat
            owner_handle:
              allOf:
                - $ref: '#/components/schemas/ChatHandle'
              description: The handle that owns this chat (your phone number)
            health_status:
              $ref: '#/components/schemas/HealthStatus'
        direction:
          type: string
          enum:
            - outbound
            - inbound
          description: '"outbound" if you sent the original message, "inbound" if you received it'
        edited_at:
          type: string
          format: date-time
          description: When the edit occurred
          example: '2026-03-05T02:12:46.487Z'
        id:
          type: string
          format: uuid
          description: Message identifier
        part:
          type: object
          description: The edited part
          required:
            - index
            - text
          properties:
            index:
              type: integer
              description: Zero-based index of the edited part within the message
              example: 4
            text:
              type: string
              description: New text content of the part
