          schema:
            type: string
            example: b2c3d4e5-f6a7-8901-bcde-f23456789012
      responses:
        '200':
          description: Webhook subscription found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateWebhookSubscription
      summary: Update a webhook subscription
      description: |
        Update an existing webhook subscription. You can modify the target URL,
        subscribed events, or activate/deactivate the subscription.

        **Note:** The signing secret cannot be changed via this endpoint.
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: Unique identifier of the webhook subscription
          schema:
            type: string
            example: b2c3d4e5-f6a7-8901-bcde-f23456789012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
            examples:
              updateURL:
                summary: Update target URL
                value:
                  target_url: https://webhooks.example.com/linq/events
              updateEvents:
                summary: Update subscribed events
                value:
                  subscribed_events:
                    - message.sent
                    - message.delivered
              deactivate:
                summary: Deactivate subscription
                value:
                  is_active: false
              filterByPhoneNumbers:
                summary: Filter to specific phone numbers
                value:
                  phone_numbers:
                    - '+12025551234'
                    - '+12025559876'
              clearPhoneFilter:
                summary: Remove phone number filter (receive all events)
                value:
                  phone_numbers: []
      responses:
        '200':
          description: Webhook subscription updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      description: Delete a webhook subscription.
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          description: Unique identifier of the webhook subscription
          schema:
            type: string
            example: b2c3d4e5-f6a7-8901-bcde-f23456789012
      responses:
        '204':
          description: Webhook subscription deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
