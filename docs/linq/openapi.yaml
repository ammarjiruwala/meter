openapi: 3.1.0
info:
  title: Linq Partner API
  version: 1.0.0
  description: |
    The Linq Partner API enables you to send and receive iMessages programmatically at scale. Build powerful messaging experiences, automate conversations, and integrate iMessage infrastructure directly into your applications.

    Messages are sent through Apple's iMessage protocol using real devices, ensuring full compatibility with all iMessage features including read receipts, typing indicators, reactions, and rich media attachments.

    ## Getting Started

    All API requests require authentication via the `Authorization: Bearer` header. Your bearer token determines which phone numbers you can send from and which data you can access.

    ```bash
    curl https://api.linqapp.com/api/partner/v3/chats \
      -H "Authorization: Bearer your_token_here"
    ```

    ## Key Concepts

    - **Chats**: Conversation threads with one or more participants
    - **Messages**: Individual messages within a chat, supporting text, attachments, effects, and reactions
    - **Participants**: Phone numbers or email addresses involved in a conversation
    - **Attachments**: Files (images, videos, documents, audio) sent with messages
    - **Webhooks**: Real-time notifications for incoming messages, reactions, and events

    ## Trace Context (OpenTelemetry)

    The Linq API supports [W3C Trace Context](https://www.w3.org/TR/trace-context/) for distributed tracing. Every API response includes an `X-Trace-ID` response header that can be used for debugging and support requests.
    Error responses and webhook payloads also include `trace_id` in the response body for convenience.

    Linq generates a new trace context for each incoming request. Any `traceparent` or `tracestate` headers you provide will be replaced with a server-generated trace ID, per the W3C specification's security recommendations for public APIs acting as trust boundaries.

    ## Example Apps

    These open-source example apps show what you can build with the Linq Partner API. Each repo is ready to clone, configure with your API keys, and run.

    ### Claude
    Text with Claude directly through iMessage. No need to install the Claude app.

    [📦 GitHub Repo](https://github.com/linq-team/ai-agent-example)

    ### Resy
    A Resy reservation agent accessible via iMessage. Built on Linq API and Claude.

    [📦 GitHub Repo](https://github.com/linq-team/linq-resy-agent)

    ### Kalshi
    A prediction market trading agent for Kalshi, accessible via iMessage. Built on Linq API and Claude.

    [📦 GitHub Repo](https://github.com/linq-team/kalshi-agent)

    ### Granola
    A meeting notes agent powered by Claude that connects to your Granola account. Search notes via iMessage.

    [📦 GitHub Repo](https://github.com/linq-team/granola-agent)

    ### Claude Code
    Build and deploy iMessage integrations using Claude Code with the Linq CLI. Ship conversational agents in minutes.

    [📦 GitHub Repo](https://github.com/linq-team/claude-code-imessage-channel)
