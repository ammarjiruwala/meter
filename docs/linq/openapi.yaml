            Time-limited link to a vCard (`.vcf`) for the selected line. The card
            carries the line's contact details with the selected number as the
            primary `TEL` and the partner's other available lines as backups. The
            link expires; re-call this endpoint to mint a fresh one.
          example: https://s3.us-east-1.amazonaws.com/linq-attachments/vcf/9716d5c5/12025551234.vcf?X-Amz-Signature=...
    PhoneNumberInfoV2:
      type: object
