  /v3/payment_requests:
    post:
      operationId: createPaymentRequest
      summary: Create a payment request
      description: |
        Creates a payment request and returns a `checkout_url` the recipient
        opens to pay with Apple Pay or card. Funds settle directly to your
        connected Stripe account. A payment request is independent of any chat;
        to associate one with a chat for your records, store the chat id in
        `metadata`. Requires your connected account to be `charges_enabled`
        (returns `403` otherwise).

        Set `mode: subscription` with a recurring `price_id` from your connected
        Stripe account to start an **auto-renewing subscription** instead of a
        one-time charge — the recipient pays the first invoice at checkout and
        the response's `stripe` object carries the customer and subscription ids
        for the ongoing lifecycle in your own Stripe account. See the
        *Subscriptions* section of the tag overview.

        In either mode, pass `customer_id` to attach the request to an
        **existing Customer** on your connected account instead of creating a
        new one — see *Pre-created customers* in the tag overview.
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional idempotency key (max 200 characters). Reuse the same key to
            safely retry without creating a second payment request. Reusing a key
            with different request parameters returns 409.
          schema:
            type: string
            maxLength: 200
            example: pr-abc123xyz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequestRequest'
            examples:
              basic:
                summary: Request $4.97 with a note
                value:
                  amount: 497
                  currency: usd
                  description: Coffee with Ava
                  metadata:
                    order_id: order_8675309
              subscription:
                summary: Start a monthly subscription
                value:
                  mode: subscription
                  price_id: price_1QAbCdEfGhIjKlMn
                  description: Coaching membership
                  metadata:
                    member_id: member_42
              existing_customer:
                summary: Charge an existing customer
                value:
                  amount: 497
                  currency: usd
                  customer_id: cus_QAbCdEfGhIjKlMn
                  description: Coffee with Ava
              trial:
                summary: Start a subscription with a 14-day free trial
                value:
                  mode: subscription
                  price_id: price_1QAbCdEfGhIjKlMn
                  trial_period_days: 14
                  description: Coaching membership
                  metadata:
                    member_id: member_42
      responses:
        '201':
          description: Payment request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listPaymentRequests
      summary: List payment requests
      description: |
        Lists your payment requests, newest first, for reconciliation. Paginate
        with `limit` + `offset`; `has_more` indicates whether another page exists.
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Max results to return (default 20, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          required: false
          description: Filter by lifecycle status.
          schema:
            type: string
            enum:
              - requested
              - authorized
              - succeeded
              - canceled
              - expired
              - declined
      responses:
        '200':
          description: Payment requests listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
