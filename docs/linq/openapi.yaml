            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentHandleRequest'
      responses:
        '200':
          description: Connection established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHandleConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/payments/handles/{handle}/connection:
    get:
      operationId: getPaymentHandleConnection
      summary: Get a handle's connection status
      tags:
        - Agentcard
      security:
        - BearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          description: Customer phone (E.164) or email
