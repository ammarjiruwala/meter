  phone_number.status_updated.v2026-02-03:
    post:
      tags:
        - '2026-02-03'
      operationId: webhookPhoneNumberStatusUpdatedV20260203
      summary: Phone number status updated
      description: |
        Triggered when a phone number's service or health status changes.
        Use this to monitor phone number health and availability.

        **Service status (`previous_status` / `new_status`):**
        - `ACTIVE` — Phone number is in service and can send/receive messages
        - `FLAGGED` — Phone number has been flagged by the carrier and may have limited functionality

        **Reputation (`previous_reputation` / `new_reputation`):**
        - `HEALTHY` — The line is in good standing. Send normally.
        - `AT_RISK` — Warning signs on the line: engagement is low across many of its conversations, or it's starting too many brand-new conversations in a single day — and a spike in send volume can add to either. Slow the line's send pace, avoid opening many new conversations at once, and review your messaging patterns.
        - `CRITICAL` — Strong signals that messages from this line aren't landing well. Pause outbound on the line until it recovers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberStatusUpdatedWebhook'
            example:
              api_version: v3
              webhook_version: '2026-02-03'
              event_type: phone_number.status_updated
              event_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              created_at: '2026-02-18T18:35:05.363Z'
              trace_id: b66e67c5c6b2c20e41d53c51698db27a
              partner_id: your-partner-id
              data:
                phone_number: '+12025551234'
                previous_status: ACTIVE
                new_status: FLAGGED
                previous_reputation: AT_RISK
                new_reputation: CRITICAL
                changed_at: '2026-02-18T18:35:05.000Z'
      responses:
        '200':
          description: Webhook received successfully
