  /v3/webhook-events:
    get:
      operationId: listWebhookEvents
      summary: List available webhook event types
      description: |
        Returns all available webhook event types that can be subscribed to.
        Use this endpoint to discover valid values for the `subscribed_events`
        field when creating or updating webhook subscriptions.
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of available webhook event types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventsResult'
              example:
                events:
                  - message.sent
                  - message.received
                  - message.read
                  - message.delivered
                  - message.failed
                  - reaction.added
                  - reaction.removed
                  - participant.added
                  - participant.removed
                  - chat.created
                  - chat.group_name_updated
                  - chat.group_icon_updated
                  - chat.group_name_update_failed
                  - chat.group_icon_update_failed
                  - chat.typing_indicator.started
                  - chat.typing_indicator.stopped
                  - message.edited
                  - phone_number.status_updated
                doc_url: https://docs.linqapp.com/guides/webhooks/events
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/webhook-subscriptions:
    post:
      operationId: createWebhookSubscription
      summary: Create a new webhook subscription
      description: |
        Create a new webhook subscription to receive events at a target URL.
        Upon creation, a signing secret is generated for verifying webhook
        authenticity. **Store this secret securely — it cannot be retrieved later.**

        **Phone Number Filtering:**
        - Optionally specify `phone_numbers` to only receive events for specific lines
        - If omitted, events from all phone numbers are delivered (default behavior)
        - Use multiple subscriptions with different `phone_numbers` to route different lines to different endpoints
        - Each `target_url` can only be used once per account. To route different
          lines to different destinations, use a unique URL per subscription
          (e.g., append a query parameter: `https://example.com/webhook?line=1`)

        **Webhook Delivery:**
        - Events are sent via HTTP POST to the target URL
        - Each request includes [Standard Webhooks](https://github.com/standard-webhooks/standard-webhooks) headers (`webhook-id`, `webhook-timestamp`, `webhook-signature`) for signature verification
        - Legacy `X-Webhook-*` headers are also sent for backwards compatibility (deprecated)
        - See [Verifying Webhook Signatures](https://docs.linqapp.com/guides/webhooks#verifying-webhook-signatures) for verification details
        - Failed deliveries (5xx, 429, network errors) are retried up to 10 times over ~25 minutes with exponential backoff
        - Client errors (4xx except 429) are not retried
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
            examples:
              messageEvents:
                summary: Subscribe to message events
                value:
                  target_url: https://webhooks.example.com/linq/events
                  subscribed_events:
                    - message.sent
                    - message.delivered
                    - message.read
              messageEventsWithVersion:
                summary: Subscribe with explicit webhook version
                value:
                  target_url: https://webhooks.example.com/linq/events?version=2026-02-03
                  subscribed_events:
                    - message.sent
                    - message.delivered
                    - message.read
              allEvents:
                summary: Subscribe to all events
                value:
                  target_url: https://webhooks.example.com/linq/events
                  subscribed_events:
                    - message.sent
                    - message.received
                    - message.delivered
                    - message.read
                    - message.failed
                    - message.edited
                    - reaction.added
                    - reaction.removed
                    - participant.added
                    - participant.removed
                    - chat.created
                    - chat.group_name_updated
                    - chat.group_icon_updated
                    - chat.group_name_update_failed
                    - chat.group_icon_update_failed
                    - chat.typing_indicator.started
                    - chat.typing_indicator.stopped
                    - phone_number.status_updated
              perLineSubscription:
                summary: Subscribe to events for specific phone numbers only
                value:
                  target_url: https://webhooks.example.com/linq/line1
                  subscribed_events:
                    - message.sent
                    - message.received
                  phone_numbers:
                    - '+12025551234'
      responses:
        '201':
          description: Webhook subscription created successfully. The signing_secret is only returned in this response - store it securely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listWebhookSubscriptions
      summary: List all webhook subscriptions
      description: |
        Retrieve all webhook subscriptions for the authenticated partner.
        Returns a list of active and inactive subscriptions with their
        configuration and status.
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of webhook subscriptions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhookSubscriptionsResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v3/webhook-subscriptions/{subscriptionId}:
    get:
      operationId: getWebhookSubscription
      summary: Get a webhook subscription by ID
      description: |
        Retrieve details for a specific webhook subscription including its
        target URL, subscribed events, and current status.
      tags:
        - Webhooks
      security:
        - BearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
